name: Daily Veille Procurement

on:
  schedule:
    - cron: '0 6 * * *'  # 6h UTC = 8h Paris
  workflow_dispatch:

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install openai requests feedparser

      - name: Run veille
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: python veille.py

      - name: Commit briefs
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add veille_briefs/ veille_archive/
          git diff --staged --quiet || git commit -m "veille $(date +%Y-%m-%d)"
          git push
