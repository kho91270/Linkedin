
name: Daily Veille Procurement

on:
  schedule:
    # Tous les jours a 6h00 UTC (8h00 Paris)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install openai requests feedparser

      - name: Run veille
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: python veille.py

      - name: Commit and push briefs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add veille_briefs/ veille_archive/
          git diff --staged --quiet || git commit -m "Daily veille brief $(date +%Y-%m-%d)"
          git push

