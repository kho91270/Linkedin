name: Generate Post and Send Approval Email

on:
  schedule:
    - cron: '0 17 * * 1,3,5'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install groq requests google-auth google-auth-oauthlib google-api-python-client

      - name: Generate and notify
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LEONARDO_API_KEY: ${{ secrets.LEONARDO_API_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python bot.py generate

      - name: Commit pending
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -A pending_approval/ tracker.json
          git diff --staged --quiet || git commit -m "post generated $(date +%Y-%m-%d)"
          git push
