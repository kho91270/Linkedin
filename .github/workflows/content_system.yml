name: Content System (Veille + Recycling)

on:
  schedule:
    - cron: '0 7 * * 1'  # Chaque lundi a 7h UTC (9h Luxembourg)
  workflow_dispatch:

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install gspread oauth2client feedparser

      - name: Run Veille
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python veille.py

  recycling:
    runs-on: ubuntu-latest
    needs: veille
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install gspread oauth2client

      - name: Run Recycler
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python recycler.py

