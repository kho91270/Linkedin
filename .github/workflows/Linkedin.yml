```yaml
name: LinkedIn Full System

on:
  schedule:
    # Publication quotidienne a 8h30 Luxembourg (6h30 UTC)
    - cron: '30 6 * * *'
    # Reply bot toutes les 2h (8h-20h Luxembourg = 6h-18h UTC)
    - cron: '0 8,10,12,14,16,18 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action a executer'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - publish_only
          - analytics_only
          - engagement_only
          - veille_only
          - recycler_only
          - reply_only

# FIX 1 : Empecher les executions paralleles (evite conflit git)
concurrency:
  group: linkedin-system
  cancel-in-progress: false

jobs:
  # ============================================================
  # DETECTER QUEL CRON A DECLENCHE LE WORKFLOW
  # ============================================================
  detect_trigger:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    outputs:
      is_publish_time: ${{ steps.check.outputs.is_publish }}
      is_reply_time: ${{ steps.check.outputs.is_reply }}
    steps:
      - name: Detect trigger type
        id: check
        run: |
          HOUR=$(date -u +%H)
          MINUTE=$(date -u +%M)
          echo "Current UTC time: ${HOUR}:${MINUTE}"
          if [ "$HOUR" = "06" ] && [ "$MINUTE" -ge "25" ] && [ "$MINUTE" -le "35" ]; then
            echo "is_publish=true" >> $GITHUB_OUTPUT
            echo "is_reply=false" >> $GITHUB_OUTPUT
          else
            echo "is_publish=false" >> $GITHUB_OUTPUT
            echo "is_reply=true" >> $GITHUB_OUTPUT
          fi

  # ============================================================
  # JOB 1 : PUBLICATION QUOTIDIENNE (tous les jours a 8h30)
  # ============================================================
  publish:
    runs-on: ubuntu-latest
    needs: detect_trigger
    if: |
      always() && (
        github.event.inputs.action == 'all' ||
        github.event.inputs.action == 'publish_only' ||
        (needs.detect_trigger.outputs.is_publish_time == 'true')
      )
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread oauth2client requests

      - name: Publish post
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LEONARDO_API_KEY: ${{ secrets.LEONARDO_API_KEY }}
        run: python bot.py

  # ============================================================
  # JOB 2 : ENGAGEMENT (tous les jours apres publication)
  # ============================================================
  engagement:
    runs-on: ubuntu-latest
    needs: publish
    if: |
      always() && (
        github.event.inputs.action == 'all' ||
        github.event.inputs.action == 'engagement_only' ||
        (needs.detect_trigger.outputs.is_publish_time == 'true')
      )
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread oauth2client

      - name: Generate engagement plan
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python engagement.py

  # ============================================================
  # JOB 3 : ANALYTICS (tous les jours apres publication)
  # ============================================================
  analytics:
    runs-on: ubuntu-latest
    needs: publish
    if: |
      always() && (
        github.event.inputs.action == 'all' ||
        github.event.inputs.action == 'analytics_only' ||
        (needs.detect_trigger.outputs.is_publish_time == 'true')
      )
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread oauth2client requests

      - name: Track analytics
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: python analytics.py

  # ============================================================
  # JOB 4 : REPLY BOT (toutes les 2h de 10h a 20h Luxembourg)
  # ============================================================
  reply:
    runs-on: ubuntu-latest
    needs: detect_trigger
    if: |
      always() && (
        github.event.inputs.action == 'reply_only' ||
        github.event.inputs.action == 'all' ||
        (needs.detect_trigger.outputs.is_reply_time == 'true')
      )
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread oauth2client requests

      - name: Run reply bot
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python reply_bot.py

      - name: Save tracking file
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Reply Bot"
          git add replied_comments.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update replied tracking"
          git push || true

  # ============================================================
  # JOB 5 : VEILLE (seulement le lundi a 8h30)
  # ============================================================
  veille:
    runs-on: ubuntu-latest
    needs: detect_trigger
    if: |
      always() && (
        github.event.inputs.action == 'veille_only' ||
        (needs.detect_trigger.outputs.is_publish_time == 'true' && github.event.schedule == '30 6 * * 1')
      )
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread oauth2client feedparser

      - name: Run veille
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python veille.py

  # ============================================================
  # JOB 6 : RECYCLAGE (seulement le lundi apres veille)
  # ============================================================
  recycler:
    runs-on: ubuntu-latest
    needs: veille
    if: |
      always() && (
        github.event.inputs.action == 'recycler_only' ||
        (needs.detect_trigger.outputs.is_publish_time == 'true' && github.event.schedule == '30 6 * * 1')
      )
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread oauth2client

      - name: Run recycler
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python recycler.py
