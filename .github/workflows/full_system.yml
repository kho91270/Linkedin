name: LinkedIn Full System

on:
  schedule:
    # Publication quotidienne a 8h30 Luxembourg (6h30 UTC)
    - cron: '30 6 * * *'
    # Reply bot toutes les 2h (8h-20h Luxembourg = 6h-18h UTC)
    - cron: '0 6,8,10,12,14,16,18 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action a executer'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - publish_only
          - analytics_only
          - engagement_only
          - veille_only
          - recycler_only
          - reply_only

jobs:
  # ============================================================
  # JOB 1 : PUBLICATION QUOTIDIENNE (tous les jours a 8h30)
  # ============================================================
  publish:
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.action == 'all' ||
      github.event.inputs.action == 'publish_only' ||
      (github.event_name == 'schedule' && github.event.schedule == '30 6 * * *')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread oauth2client requests

      - name: Publish post
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
          LEONARDO_API_KEY: ${{ secrets.LEONARDO_API_KEY }}
        run: python bot.py

  # ============================================================
  # JOB 2 : ENGAGEMENT (tous les jours apres publication)
  # ============================================================
  engagement:
    runs-on: ubuntu-latest
    needs: publish
    if: |
      always() && (
        github.event.inputs.action == 'all' ||
        github.event.inputs.action == 'engagement_only' ||
        (github.event_name == 'schedule' && github.event.schedule == '30 6 * * *')
      )
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread oauth2client

      - name: Generate engagement plan
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python engagement.py

  # ============================================================
  # JOB 3 : ANALYTICS (tous les jours apres publication)
  # ============================================================
  analytics:
    runs-on: ubuntu-latest
    needs: publish
    if: |
      always() && (
        github.event.inputs.action == 'all' ||
        github.event.inputs.action == 'analytics_only' ||
        (github.event_name == 'schedule' && github.event.schedule == '30 6 * * *')
      )
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread oauth2client requests

      - name: Track analytics
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
        run: python analytics.py

  # ============================================================
  # JOB 4 : REPLY BOT (toutes les 2h de 8h a 20h)
  # ============================================================
  reply:
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.action == 'reply_only' ||
      github.event.inputs.action == 'all' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 6,8,10,12,14,16,18 * * *')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run reply bot
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python reply_bot.py

      - name: Save tracking file
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Reply Bot"
          git add replied_comments.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update replied tracking"
          git push || true

  # ============================================================
  # JOB 5 : VEILLE (seulement le lundi a 8h30)
  # ============================================================
  veille:
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.action == 'veille_only' ||
      (github.event_name == 'schedule' && github.event.schedule == '30 6 * * 1')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread oauth2client feedparser

      - name: Run veille
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python veille.py

  # ============================================================
  # JOB 6 : RECYCLAGE (seulement le lundi apres veille)
  # ============================================================
  recycler:
    runs-on: ubuntu-latest
    needs: veille
    if: |
      always() && (
        github.event.inputs.action == 'recycler_only' ||
        (github.event_name == 'schedule' && github.event.schedule == '30 6 * * 1')
      )
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread oauth2client

      - name: Run recycler
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python recycler.py
