name: LinkedIn Daily Post

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install PyPDF2

      - name: Split carrousels from PDFs
        run: python split_carrousels.py

      - name: Publish to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          CAROUSEL_DIR: ./carrousels
          COUNTER_FILE: ./jour_counter.txt
        run: python bot.py

      - name: Save counter
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add jour_counter.txt
          git diff --staged --quiet || git commit -m "📅 Jour publié"
          git push
